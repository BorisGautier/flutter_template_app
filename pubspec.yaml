name: flutter_template_app
description: "Template Flutter production-ready — Clean Architecture, BLoC, Chopper, Drift, Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === STATE MANAGEMENT ===
  flutter_bloc: ^9.1.1       # Gestion d'état BLoC
  equatable: ^2.0.8          # Comparaison d'états sans boilerplate

  # === NAVIGATION ===
  go_router: ^17.1.0         # Routeur déclaratif avec deep links

  # === INJECTION DE DÉPENDANCES ===
  get_it: ^9.2.0             # Service locator
  injectable: ^2.7.1+4       # Annotations DI + génération de code

  # === RÉSEAU ===
  chopper: ^8.5.1            # Client HTTP + intercepteurs
  http: ^1.6.0               # Client HTTP de base
  http_parser: ^4.1.2        # Parseur HTTP
  internet_connection_checker: ^3.0.1  # Détection connectivité

  # === BASE DE DONNÉES & STOCKAGE LOCAL ===
  drift: ^2.21.0             # ORM SQLite avec génération de code
  drift_flutter: ^0.2.7      # Intégration Drift/Flutter
  flutter_secure_storage: ^10.0.0  # Stockage chiffré (tokens)
  shared_preferences: ^2.5.4 # Préférences utilisateur simples

  # === FIREBASE & NOTIFICATIONS ===
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_auth: ^6.5.4
  firebase_crashlytics: ^5.2.2
  firebase_performance: ^0.11.1+3
  flutter_local_notifications: ^18.0.1

  # === AUTHENTIFICATION SOCIALE ===
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.1
  local_auth: ^3.0.2         # Biométrie

  # === UI & DESIGN ===
  google_fonts: ^8.0.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  animations: ^2.1.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  pinput: ^6.0.2
  flutter_markdown: ^0.7.7+1
  showcaseview: ^3.0.0
  fl_chart: ^0.68.0
  confetti: ^0.8.0

  # === INTERNATIONALISATION ===
  intl: ^0.20.2

  # === UTILITAIRES ===
  fpdart: ^1.2.0             # Programmation fonctionnelle (Either, Option)
  dartz: ^0.10.1
  flutter_dotenv: ^6.0.0     # Variables d'environnement
  logger: ^2.6.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  device_info_plus: 12.3.0
  collection: ^1.19.0
  timeago: ^3.7.1
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  provider: ^6.1.5+1
  intl_phone_field: ^3.2.0

  # === SERVICES NATIFS ===
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  record: ^6.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.3.0

  # === PDF & QR ===
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0

  # === TÉLÉMÉTRIE ===
  opentelemetry: any

  # === SÉCURITÉ ===
  # TODO: [TEMPLATE] Activer freerasp pour la détection root/jailbreak (requis Dart >=3.10)
  # freerasp: ^7.5.1
  # TODO: [TEMPLATE] Activer sqlcipher pour Drift chiffré (requis Dart >=3.10)
  # sqlcipher_flutter_libs: ^0.7.0+eol

  # === ICÔNES ===
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # === GÉNÉRATION DE CODE ===
  # Les fichiers générés (*.g.dart, injection.config.dart) sont committés.
  # Pour régénérer : dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.13
  json_serializable: ^6.14.0
  injectable_generator: ^2.6.2
  chopper_generator: ^8.6.1
  drift_dev: ^2.21.2

  # === TESTS ===
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # === QUALITÉ ===
  flutter_lints: ^6.0.0

  # === BUILD ===
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  # TODO: [TEMPLATE] Remplacer par votre logo
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env

