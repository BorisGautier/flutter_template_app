name: Release Android

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Environnement ──
      - name: Create .env file
        run: |
          echo "APP_NAME=${{ vars.APP_NAME }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_PROD }}" >> .env

      # ── Signature Android ──
      # Secrets requis :
      #   KEYSTORE_BASE64     : contenu du .jks encodé en base64
      #   KEYSTORE_PASSWORD   : mot de passe du keystore
      #   KEY_ALIAS           : alias de la clé
      #   KEY_PASSWORD        : mot de passe de la clé
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      # ── Build ──
      - name: Build App Bundle (release)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --dart-define=APP_ENV=production

      # ── Upload symbols ──
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols/android/
          retention-days: 30

      # ── Upload to Play Store ──
      # Secret requis : PLAY_STORE_SERVICE_ACCOUNT_JSON (JSON du compte de service)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      # ── Créer une GitHub Release ──
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          name: "Release ${{ steps.version.outputs.version }}"
