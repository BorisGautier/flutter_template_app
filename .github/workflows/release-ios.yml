name: Release iOS

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      destination:
        description: 'Destination de déploiement'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - app-store

jobs:
  release-ios:
    name: Build & Release iOS
    runs-on: macos-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Environnement ──
      - name: Create .env file
        run: |
          echo "APP_NAME=${{ vars.APP_NAME }}" >> .env
          echo "APP_ENV=production" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_PROD }}" >> .env

      # ── Signature iOS ──
      # Secrets requis :
      #   IOS_CERTIFICATE_BASE64      : certificat P12 encodé base64
      #   IOS_CERTIFICATE_PASSWORD    : mot de passe du P12
      #   IOS_PROVISIONING_PROFILE    : profil de provisioning encodé base64
      #   IOS_KEYCHAIN_PASSWORD       : mot de passe keychain temporaire (aléatoire)
      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      # ── Build ──
      - name: Build IPA (release)
        run: |
          flutter build ipa --release \
            --obfuscate \
            --split-debug-info=build/symbols/ios \
            --dart-define=APP_ENV=production \
            --export-options-plist=ios/ExportOptions.plist

      # ── Upload to TestFlight / App Store ──
      # Remplace xcrun altool (déprécié Xcode 14, supprimé Xcode 16)
      # Secrets requis :
      #   APP_STORE_CONNECT_API_KEY_ID         : Key ID App Store Connect
      #   APP_STORE_CONNECT_API_ISSUER_ID      : Issuer ID
      #   APP_STORE_CONNECT_API_KEY_CONTENT    : contenu brut de la clé .p8 (pas base64)
      - name: Upload to TestFlight / App Store
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      # ── Cleanup keychain ──
      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision || true
          rm /tmp/AuthKey.p8 || true
