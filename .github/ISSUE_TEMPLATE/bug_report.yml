name: 🐛 Rapport de bug
description: Signaler un comportement inattendu ou un crash
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport.
        Vérifiez qu'une issue similaire n'existe pas déjà avant de soumettre.

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Description claire et concise du problème.
      placeholder: "Quand je fais X, il se passe Y au lieu de Z…"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Faire défiler jusqu'à '...'
        4. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran ou enregistrements
      description: Glissez-déposez ici vos captures d'écran si applicable.

  - type: dropdown
    id: platform
    attributes:
      label: Plateforme(s) affectée(s)
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Version Flutter
      description: Sortie de `flutter --version`
      placeholder: "Flutter 3.44.0 • channel beta • Dart 3.12.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Appareil / Émulateur
      placeholder: "Pixel 8 Pro (Android 14) / iPhone 15 Pro (iOS 17.4)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs de la console
      description: Coller les logs pertinents (`flutter run`, logcat, Crashlytics…)
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist avant soumission
      options:
        - label: J'ai vérifié qu'une issue similaire n'existe pas déjà
          required: true
        - label: J'ai testé sur la dernière version du dépôt (`git pull`)
          required: true
        - label: J'ai inclus les étapes de reproduction
          required: true
